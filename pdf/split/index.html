<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>分割 | PDFツール</title>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="back" href="../">← PDFツール</a>
      <div class="title-bar"><h1 class="grad-purple">✂️ PDF分割</h1></div>
      <div class="spacer"></div>
    </header>

    <div class="dropzone" id="dz">
      <input type="file" id="fi" accept="application/pdf" hidden />
      <div class="icon">✂️</div>
      <p><b>タップしてPDFを選択</b></p>
      <p class="sub">1ファイルずつ分割できます</p>
    </div>

    <div class="controls" id="controls" style="display:none;">
      <div class="file-item">
        <span class="name" id="srcName"></span>
        <span class="size" id="srcSize"></span>
      </div>
      <div class="field">
        <label>モード</label>
        <div class="radio-row">
          <label><input type="radio" name="mode" value="range" checked><span>🎯 ページ範囲で抽出</span></label>
          <label><input type="radio" name="mode" value="each"><span>📄 1ページずつZIPで</span></label>
        </div>
      </div>
      <div class="field" id="rangeField">
        <label for="range">ページ範囲 (例: 1-3, 5, 8-10)</label>
        <input type="text" id="range" value="1" />
      </div>
      <div class="field" id="namingField" style="display:none;">
        <label>ZIP内のファイル名</label>
        <div class="radio-row">
          <label><input type="radio" name="naming" value="name" checked><span>🧑 宛名で命名（山田太郎.pdf）</span></label>
          <label><input type="radio" name="naming" value="seq"><span>🔢 連番のみ（page_001.pdf）</span></label>
        </div>
        <p class="info-hint" id="namingHint">各ページの「◯◯様」を読み取って名前を付けます。読み取れないページは連番になります。</p>
      </div>
      <div class="field">
        <label for="fname">出力ファイル名</label>
        <input type="text" id="fname" value="split" />
      </div>
      <button class="btn-primary purple" id="run">✂️ 分割してダウンロード</button>
      <button class="btn-secondary" id="clear">別のPDFを選ぶ</button>
    </div>

    <div id="msg"></div>
    <p class="info-hint">範囲抽出は抽出した分だけ1つのPDFにまとめ、1ページずつは複数ファイルを<b>ZIP</b>で出力します。1ページずつでは各ページの<b>宛名（◯◯様）</b>を読み取ってファイル名にできます。読み取れない場合や連番モードでは <code>page_001.pdf</code> のような短い名前になり、解凍時にパスが長すぎて開けなくなるのを防ぎます。</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
  <script src="../shared.js"></script>
  <script>
    const { fmtSize, download, safeFilename, bindDropzone, showError, clearBox, refuseIfEncrypted, appendPrintButton, setupPdfJs } = PDFApp;
    const dz = document.getElementById('dz');
    const fi = document.getElementById('fi');
    const controls = document.getElementById('controls');
    const runBtn = document.getElementById('run');
    const clearBtn = document.getElementById('clear');
    const msg = document.getElementById('msg');
    const fname = document.getElementById('fname');
    const srcName = document.getElementById('srcName');
    const srcSize = document.getElementById('srcSize');
    const rangeInput = document.getElementById('range');
    const rangeField = document.getElementById('rangeField');
    const namingField = document.getElementById('namingField');

    let currentFile = null;

    // 解凍時の Windows パス長対策。安全化した名前を max 文字に丸め、
    // 末尾の区切り文字を落として見苦しくならないようにする。
    function pathSafeBase(name, max) {
      let b = safeFilename(name, 'split');
      if (b.length > max) b = b.slice(0, max).replace(/[ _.\-]+$/, '');
      return b || 'split';
    }

    // pdf.js のテキストアイテムを、y 座標でグループ化して視覚的な行に復元する。
    // 各行は左→右、行は上→下の読み順。宛名抽出の精度を上げるため。
    function pageToLines(content) {
      const rows = [];
      for (const it of content.items) {
        if (!it || !it.str || !it.str.trim()) continue;
        const x = it.transform ? it.transform[4] : 0;
        const y = it.transform ? it.transform[5] : 0;
        let row = null;
        for (const r of rows) { if (Math.abs(r.y - y) <= 2) { row = r; break; } }
        if (!row) { row = { y, items: [] }; rows.push(row); }
        row.items.push({ x, str: it.str });
      }
      rows.sort((a, b) => b.y - a.y);
      return rows.map(r => r.items.sort((a, b) => a.x - b.x).map(i => i.str).join('').replace(/\s+/g, ' ').trim());
    }

    // 汎用敬称・複合語を宛名として誤検出しないための除外語。
    const NAME_STOP = /(お客|皆|各位|会員|関係者|担当|御中|一同|貴社|貴店|貴行|人事|総務)/;
    // 宛名として妥当な文字（漢字・かな・カナ・英字・中黒・空白）。
    const NAME_CHARS = '\\u4e00-\\u9fff\\u3040-\\u309f\\u30a0-\\u30ff\\u30fc\\uff66-\\uff9fA-Za-z\\uff21-\\uff5a\\u3000 ・･.';
    // 「様」の直後が行末/空白/句読点のときだけ採用 → 「様式」「仕様」等の複合語を除外。
    const ADDRESSEE_RE = new RegExp('([' + NAME_CHARS + ']{1,24}?)[ \\u3000]*様(?=[\\s\\u3000、。)\\]）」]|$)');

    // 1ページ分の行配列から宛名（◯◯様 の ◯◯）を1件返す。無ければ null。
    function findAddressee(lines) {
      for (const line of lines) {
        const m = line.match(ADDRESSEE_RE);
        if (!m) continue;
        let name = m[1].replace(/[\s　・･.]+/g, '').trim();
        // 日本語名の先頭に紛れ込んだ英数字コード/IDを除去（外国人名はそのまま）。
        if (/[一-鿿぀-ゟ゠-ヿｦ-ﾟ]/.test(name)) name = name.replace(/^[A-Za-z0-9]+/, '');
        if (name.length < 1 || name.length > 20) continue;
        if (NAME_STOP.test(name)) continue;
        // 少なくとも1文字は名前らしい文字を含むこと（記号/数字のみを除外）。
        if (!/[一-鿿぀-ゟ゠-ヿｦ-ﾟA-Za-z]/.test(name)) continue;
        return name;
      }
      return null;
    }

    function showSuccess(text) {
      const el = document.createElement('div');
      el.className = 'success';
      el.textContent = text;
      msg.innerHTML = '';
      msg.appendChild(el);
    }

    function updateModeUI() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      rangeField.style.display = mode === 'range' ? 'flex' : 'none';
      namingField.style.display = mode === 'each' ? 'flex' : 'none';
    }
    document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', updateModeUI));

    bindDropzone(dz, fi, (fs) => {
      const f = fs[0];
      if (!f || (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name))) {
        showError(msg, 'PDFファイルを選択してください'); return;
      }
      currentFile = f;
      srcName.textContent = f.name;
      srcSize.textContent = fmtSize(f.size);
      fname.value = safeFilename(f.name.replace(/\.pdf$/i, '') + '_split', 'split');
      dz.style.display = 'none';
      controls.style.display = 'flex';
      clearBox(msg);
    });

    clearBtn.addEventListener('click', () => {
      currentFile = null;
      dz.style.display = 'block';
      controls.style.display = 'none';
      clearBox(msg);
    });

    function parseRange(text, maxPage) {
      const parts = text.split(',').map(s => s.trim()).filter(Boolean);
      const pages = new Set();
      for (const p of parts) {
        const m = p.match(/^(\d+)(?:-(\d+))?$/);
        if (!m) throw new Error('範囲指定が不正: ' + p);
        const a = parseInt(m[1], 10);
        const b = m[2] ? parseInt(m[2], 10) : a;
        const lo = Math.min(a, b), hi = Math.max(a, b);
        if (lo < 1 || hi > maxPage) throw new Error(`ページ${lo}-${hi}は範囲外 (1-${maxPage})`);
        for (let i = lo; i <= hi; i++) pages.add(i);
      }
      return Array.from(pages).sort((a, b) => a - b);
    }

    runBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      clearBox(msg);
      runBtn.disabled = true;
      runBtn.textContent = '処理中...';
      try {
        const bytes = new Uint8Array(await currentFile.arrayBuffer());
        const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
        refuseIfEncrypted(src);
        const total = src.getPageCount();
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const base = safeFilename(fname.value, 'split');
        // Windows の MAX_PATH(260) 対策。オフィスステーション等が出す
        // 長いファイル名だと、ZIP 名・内部フォルダ・各ページ名で同じ長い名前が
        // 何重にも連結され、解凍時に「パスが長すぎて開けません」になる。
        // ZIP 名は短く抑え、中身は連番のみにしてパスを最小化する。
        const zipBase = pathSafeBase(base, 60);

        if (mode === 'range') {
          const pages = parseRange(rangeInput.value, total);
          if (!pages.length) throw new Error('範囲が空です');
          const out = await PDFLib.PDFDocument.create();
          const copied = await out.copyPages(src, pages.map(p => p - 1));
          copied.forEach(p => out.addPage(p));
          const blob = new Blob([await out.save()], { type: 'application/pdf' });
          download(blob, base + '.pdf');
          appendPrintButton(msg, blob);
        } else {
          // ZIP 内はフォルダ無し・短いファイル名にしてパスを最短化。
          // (解凍時に ZIP 名のフォルダが自動生成されるので散らからない)
          const useName = (document.querySelector('input[name="naming"]:checked') || {}).value === 'name';
          const zip = new JSZip();
          const width = Math.max(3, String(total).length);

          // 宛名命名モードでは pdf.js でテキストを読むため別途ロード。
          let textDoc = null;
          if (useName) {
            setupPdfJs();
            try { textDoc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise; }
            catch (_) { textDoc = null; }
          }

          const usedNames = new Map(); // 同名の重複回避（_2, _3…）
          let namedCount = 0;
          for (let i = 0; i < total; i++) {
            const out = await PDFLib.PDFDocument.create();
            const [p] = await out.copyPages(src, [i]);
            out.addPage(p);
            const bytesOut = await out.save();

            const num = String(i + 1).padStart(width, '0');
            let entry = `page_${num}.pdf`; // 既定 / フォールバック
            if (useName && textDoc) {
              let name = null;
              try {
                const page = await textDoc.getPage(i + 1);
                const content = await page.getTextContent();
                name = findAddressee(pageToLines(content));
              } catch (_) { name = null; }
              if (name) {
                let safe = pathSafeBase(name, 40);
                const key = safe.toLowerCase();
                const n = (usedNames.get(key) || 0) + 1;
                usedNames.set(key, n);
                entry = n > 1 ? `${safe}_${n}.pdf` : `${safe}.pdf`;
                namedCount++;
              }
            }
            zip.file(entry, bytesOut);
          }
          const blob = await zip.generateAsync({ type: 'blob' });
          download(blob, zipBase + '.zip');

          if (useName) {
            const fallback = total - namedCount;
            showSuccess(
              `${total}ページを分割しました。宛名で命名: ${namedCount}件` +
              (fallback > 0 ? ` / 宛名が読み取れず連番: ${fallback}件` : '') + '。'
            );
          }
        }
      } catch (e) {
        showError(msg, '失敗: ' + (e.message || e));
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = '✂️ 分割してダウンロード';
      }
    });
  </script>
</body>
</html>
